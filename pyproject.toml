[project]
name = "codekb"
version = "0.1.0"
description = "Local-first AI engineering knowledge base over your own source code."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
codekb = "codekb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codekb"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that are intentionally slower",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Fixtures are *inputs* to the test-suite, not code we own. broken.py in
# particular must stay a syntax error so the parser fallback path is covered.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "PTH",  # use pathlib
    "RUF",  # ruff-specific
]
ignore = [
    # Long lines are caught by E501 below; keep line-length authoritative.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests may use long literal fixtures, shadow builtins, and deliberately contain
# CJK text and fullwidth punctuation (which is the point of the CJK tests).
"tests/**" = ["B011", "SIM117", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["codekb"]